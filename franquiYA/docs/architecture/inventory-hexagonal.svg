<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 570" role="img" aria-labelledby="title desc">
  <title id="title">FranquiYA inventory hexagonal architecture</title>
  <desc id="desc">The Next.js user interface calls a FastAPI inbound adapter. It delegates to inventory application use cases and domain stock rules through a ProductRepository port. Two outbound adapters implement that port: SQLAlchemy for normal accounts and in-memory fictional data for read-only demo sessions.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#6b7280"/></marker>
    <style>
      text{font-family:Inter,Arial,sans-serif;fill:#172033}.title{font-size:28px;font-weight:700}.label{font-size:18px;font-weight:700}.body{font-size:14px;fill:#475569}.muted{font-size:13px;fill:#64748b}.box{rx:16;stroke-width:2}.arrow{stroke:#6b7280;stroke-width:2;fill:none;marker-end:url(#arrow)}.port{stroke-dasharray:7 6}
    </style>
  </defs>
  <rect width="1120" height="570" fill="#f8fafc" rx="24"/>
  <text x="40" y="52" class="title">Inventory slice · hexagonal architecture</text>
  <text x="40" y="80" class="body">Business rules depend on an interface; HTTP and storage are replaceable adapters.</text>
  <rect x="40" y="220" width="190" height="112" class="box" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="62" y="258" class="label">Next.js UI</text><text x="62" y="284" class="body">Dashboard · stock</text><text x="62" y="308" class="muted">Search · alerts · CSV</text>
  <rect x="290" y="220" width="190" height="112" class="box" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="312" y="258" class="label">FastAPI adapter</text><text x="312" y="284" class="body">/api/stock</text><text x="312" y="308" class="muted">Request / response</text>
  <rect x="555" y="150" width="260" height="250" class="box" fill="#fff7ed" stroke="#ea580c"/>
  <text x="580" y="188" class="label">Application core</text>
  <rect x="585" y="210" width="200" height="74" class="box" fill="#ffedd5" stroke="#f97316"/>
  <text x="605" y="240" class="label">Inventory service</text><text x="605" y="264" class="muted">List · get · update · alerts</text>
  <rect x="585" y="310" width="200" height="64" class="box" fill="#fee2e2" stroke="#ef4444"/>
  <text x="605" y="339" class="label">Domain rules</text><text x="605" y="361" class="muted">Critical · low · healthy</text>
  <rect x="870" y="205" width="205" height="72" class="box port" fill="#f1f5f9" stroke="#64748b"/>
  <text x="895" y="235" class="label">Repository port</text><text x="895" y="258" class="muted">ProductRepository</text>
  <rect x="870" y="335" width="205" height="76" class="box" fill="#dcfce7" stroke="#16a34a"/>
  <text x="890" y="365" class="label">SQLAlchemy adapter</text><text x="890" y="390" class="muted">Normal authenticated data</text>
  <rect x="870" y="445" width="205" height="76" class="box" fill="#cffafe" stroke="#0891b2"/>
  <text x="890" y="475" class="label">Demo adapter</text><text x="890" y="500" class="muted">Fictional · in memory · read-only</text>
  <path d="M230 276H290" class="arrow"/><path d="M480 276H555" class="arrow"/><path d="M685 284V310" class="arrow"/><path d="M815 245H870" class="arrow"/><path d="M972 277V335" class="arrow"/><path d="M972 277V445" class="arrow"/>
  <text x="40" y="535" class="muted">The existing stock HTTP contract is retained. The rest of the API is still on its earlier architecture.</text>
</svg>
